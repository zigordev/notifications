server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: notifications-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  flyway:
    enabled: true
  kafka:
    listener:
      missing-topics-fatal: false
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASS:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

notifications:
  kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:platform-redpanda:9092}
  consumer-group-id: ${KAFKA_CONSUMER_GROUP_ID:notifications-api}
  email:
    topic: ${NOTIFICATIONS_EMAIL_TOPIC:notification.email.requested.v1}
    dlt-topic: ${NOTIFICATIONS_EMAIL_DLT_TOPIC:notification.email.requested.v1.DLT}
    provider: gmail-smtp
  retry:
    interval-ms: ${NOTIFICATIONS_RETRY_INTERVAL_MS:5000}
    max-attempts: ${NOTIFICATIONS_RETRY_MAX_ATTEMPTS:4}

smtp:
  from: ${SMTP_FROM:noreply@example.com}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://otel-collector:4318/v1/traces}

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-},span=%X{spanId:-}]"
