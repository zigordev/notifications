version: 2

# Grouped and weekly on purpose: a daily stream of single-package PRs is
# noise that gets ignored, which is the same outcome as having no updates.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # vitest ships as a family that must move together. @vitest/coverage-v8
      # and @vitest/ui both peer-depend on an exact vitest version, so a
      # single-package major does not resolve at all — coverage-v8@4 wanting
      # vitest@4.1.11 against ui@3.2.7 wanting vitest@3.2.7 is not a risky
      # merge, it is an impossible one. Same shape as the @nestjs group above.
      vitest:
        patterns: ['vitest', '@vitest/*']
      # First on purpose. Dependabot puts a dependency in the first group it
      # matches, and the two groups below would otherwise split the Nest
      # packages apart by dependency-type — common and core are production,
      # testing and cli are development.
      #
      # They cannot be split. The Nest packages peer-depend on each other by
      # major: core@12 requires common@^12 and platform-express@^12, and
      # testing@12 requires all three. A single-package major is not merely
      # risky, it cannot resolve at all — #47 and #48 sat open here, each
      # individually unmergeable, and #35 (@nestjs/schematics, the one
      # package with no peer tying it to the others) did merge and broke
      # every `npm install` in this repository until it was reverted.
      #
      # No update-types here, so majors are included and the next Nest major
      # arrives as one PR moving every @nestjs/* together. Auto-merge still
      # holds majors for a human; this only makes what it holds coherent.
      nestjs:
        patterns: ['@nestjs/*']
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patch:
        dependency-type: production
        update-types: [patch]
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '06:00'
      timezone: 'Europe/Madrid'
    # Wait a week before proposing a newly published version. A compromised
    # release is usually caught and yanked within days, and nothing here is
    # urgent enough to be worth being the first to install it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
