name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # Full history: a secret committed months ago and deleted last week is
          # still in the pack file and still leaked.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  compose-validation:
    name: Compose Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Validate compose manifests
        env:
          POSTGRES_PASSWORD: app
          API_IMAGE: notifications-api:ci
          OPENBAO_TOKEN: ci-openbao-token
          TRUST_PROXY: 'false'
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
          KAFKA_BOOTSTRAP_SERVERS: platform-redpanda:9092
          NOTIFICATIONS_EMAIL_TOPIC: notification.email.requested.v1
          NOTIFICATIONS_EMAIL_DLT_TOPIC: notification.email.requested.v1.DLT
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ci@example.com
          SMTP_FROM: ci@example.com
          SMTP_STARTTLS: 'true'
        run: |
          docker compose -f docker/compose.app.local.yml config > /dev/null
          docker compose -f docker/compose.app.prod.yml config > /dev/null
          docker compose -f docker/compose.ci.yml config > /dev/null

  integration:
    name: Kafka + PostgreSQL + SMTP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, compose-validation]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run integration suite
        run: npm run test:integration

      - name: Compose logs
        if: failure()
        run: docker compose -f docker/compose.ci.yml logs --no-color
