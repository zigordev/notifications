name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action calls GET /pulls/{n}/commits to scope its scan to the PR's
    # own commits. The workflow-level `contents: read` above doesn't cover that
    # call, and Dependabot-triggered runs get no implicit permissions beyond
    # what's declared here — every Dependabot PR failed this job with a 403
    # until this was added.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # Full history: a secret committed months ago and deleted last week is
          # still in the pack file and still leaked.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: warn

  compose-validation:
    name: Compose Manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Validate compose manifests
        env:
          POSTGRES_PASSWORD: app
          API_IMAGE: notifications-api:ci
          OPENBAO_TOKEN: ci-openbao-token
          TRUST_PROXY: 'false'
          OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
          KAFKA_BOOTSTRAP_SERVERS: platform-redpanda:9092
          NOTIFICATIONS_EMAIL_TOPIC: notification.email.requested.v1
          NOTIFICATIONS_EMAIL_DLT_TOPIC: notification.email.requested.v1.DLT
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: '587'
          SMTP_USER: ci@example.com
          SMTP_FROM: ci@example.com
          SMTP_STARTTLS: 'true'
        run: |
          docker compose -f docker/compose.app.local.yml config > /dev/null
          docker compose -f docker/compose.app.prod.yml config > /dev/null
          docker compose -f docker/compose.ci.yml config > /dev/null

  integration:
    name: Kafka + PostgreSQL + SMTP Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [quality, compose-validation]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run integration suite
        run: npm run test:integration

      - name: Compose logs
        if: failure()
        run: docker compose -f docker/compose.ci.yml logs --no-color

  security-supply-chain:
    name: Security + Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: HUSKY=0 npm ci

      # A copyleft licence arriving through a transitive dependency can oblige
      # you to publish source you never intended to. Checked on every build
      # because the dangerous moment is when a licence *changes*.
      - name: Licence check (prod dependencies)
        run: node ./scripts/check-licences.mjs .

      - name: Audit dependencies (prod only, high+)
        run: npm run audit:prod:gate

      - name: Build prod image
        run: docker build -f Dockerfile --target prod -t notifications-api:ci .

      - name: Prepare artifacts dir
        run: mkdir -p artifacts

      - name: Generate SBOM
        uses: anchore/sbom-action@17ae1740179002c89186b61233e0f892c3118b11 # v0
        with:
          image: notifications-api:ci
          format: spdx-json
          output-file: artifacts/sbom-api.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Validate SBOM
        run: |
          test -s artifacts/sbom-api.spdx.json
          jq -e '.spdxVersion and (.packages | type == "array")' artifacts/sbom-api.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: artifacts/sbom-api.spdx.json
          if-no-files-found: error

      - name: Trivy scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: notifications-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os,library
          severity: HIGH,CRITICAL

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    # Semgrep rather than CodeQL: CodeQL code scanning on a *private* repository
    # requires GitHub Code Security, a paid add-on. The CodeQL workflow beside
    # this one is gated on `!repository.private` for that reason and never runs.
    # Semgrep needs no add-on, so this is the job that actually scans.
    #
    # Findings fail the build and appear in the job log. Uploading SARIF to the
    # Security tab needs the same paid add-on, so the log is the report.
    #
    # Excluded rules, each reviewed rather than waved through:
    #   missing-user: container hardening — backlog
    #   missing-user-entrypoint: container hardening — backlog
    #   writable-filesystem-service: container hardening — backlog
    #   no-new-privileges: container hardening — backlog
    #   ifs-tampering: IFS is saved and restored around the loop
    #   detected-generic-secret: entropy heuristic; gitleaks already covers secrets
    #   prototype-pollution-loop: read-only tree walks, guarded with hasOwnProperty; no assignment
    #   incomplete-sanitization: stripping '%' from a formatted percentage, not sanitisation
    #   detect-non-literal-regexp: locale comes from a fixed list, in a build script
    #   aws-subnet-has-public-ip-address: single public host by design; there is no NAT gateway
    container:
      image: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Scan
        # `semgrep scan`, not `semgrep ci`: the latter expects a Semgrep AppSec
        # Platform token and behaves differently without one. `--error` is what
        # turns a finding into a failed job rather than a printed note.
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --exclude-rule dockerfile.security.missing-user.missing-user \
            --exclude-rule dockerfile.security.missing-user-entrypoint.missing-user-entrypoint \
            --exclude-rule yaml.docker-compose.security.writable-filesystem-service.writable-filesystem-service \
            --exclude-rule yaml.docker-compose.security.no-new-privileges.no-new-privileges \
            --exclude-rule bash.lang.security.ifs-tampering.ifs-tampering \
            --exclude-rule generic.secrets.security.detected-generic-secret.detected-generic-secret \
            --exclude-rule javascript.lang.security.audit.prototype-pollution.prototype-pollution-loop.prototype-pollution-loop \
            --exclude-rule javascript.lang.security.audit.incomplete-sanitization.incomplete-sanitization \
            --exclude-rule javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule terraform.aws.security.aws-subnet-has-public-ip-address.aws-subnet-has-public-ip-address \
            --error \
            --metrics=off
