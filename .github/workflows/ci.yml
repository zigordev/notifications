name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    name: Pipeline
    uses: zigordev/toolkit/.github/workflows/check.yml@bd4cf53a7f04ac04da4c3d4c7b3d10b489c21c83 # v1.33.1
    with:
      product-folder: .
    permissions:
      contents: read
      security-events: write

  check:
    name: check
    needs: [pipeline]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Pass only when every job passed
        env:
          RESULT: ${{ needs.pipeline.result }}
        run: |
          echo "The pipeline ended with: $RESULT"
          test "$RESULT" = "success"

  publish:
    name: Publish
    needs: [check]
    if: github.event_name == 'push'
    uses: zigordev/toolkit/.github/workflows/publish.yml@bd4cf53a7f04ac04da4c3d4c7b3d10b489c21c83 # v1.33.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  release:
    name: Release
    needs: [check]
    if: github.event_name == 'push'
    uses: zigordev/toolkit/.github/workflows/release.yml@bd4cf53a7f04ac04da4c3d4c7b3d10b489c21c83 # v1.33.1
    permissions:
      contents: write
      id-token: write
