name: notifications

services:
  notifications-api:
    image: ghcr.io/zigordev/notifications-api:${VERSION:-local}
    restart: unless-stopped
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1
    environment:
      PORT: "3000"
      OTEL_SERVICE_NAME: notifications-api
      OTEL_SERVICE_VERSION: ${VERSION:-local}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
      DATABASE_URL: postgresql://notifications_api:${NOTIFICATIONS_API_DATABASE_PASSWORD:-}@notifications-postgres:5432/notifications_api
      KAFKA_BROKERS: kafka:9092
      KAFKA_USERNAME: notifications-api
      KAFKA_PASSWORD: ${KAFKA_PASSWORD:-}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURITY: none
    depends_on:
      notifications-api-migrate:
        condition: service_completed_successfully
    tmpfs:
      - /tmp:uid=1000,gid=1000,size=1m
    healthcheck:
      test:
        [
          CMD-SHELL,
          "test ! -e /tmp/drain && wget -q -T 4 -O /dev/null http://127.0.0.1:3000/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    labels:
      traefik.enable: "true"
      traefik.http.services.notifications-api.loadbalancer.server.port: "3000"
      docker-rollout.pre-stop-hook: "touch /tmp/drain && sleep 35"
    networks: [zigordev, notifications]

  notifications-api-migrate:
    image: ghcr.io/zigordev/notifications-api:${VERSION:-local}
    command: [node, src/migrate.ts]
    user: "1000:1000"
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    mem_limit: 128m
    cpus: 1
    environment:
      OTEL_SERVICE_NAME: notifications-api-migrate
      OTEL_SERVICE_VERSION: ${VERSION:-local}
      DATABASE_URL: postgresql://notifications_api:${NOTIFICATIONS_API_DATABASE_PASSWORD:-}@notifications-postgres:5432/notifications_api
      DATABASE_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:-}@notifications-postgres:5432/postgres
    labels:
      com.zigordev.job: migrate
    depends_on:
      notifications-postgres:
        condition: service_healthy
    networks: [zigordev, notifications]

  notifications-postgres:
    image: postgres:18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    mem_limit: 256m
    cpus: 1
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - notifications-postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD, pg_isready, --username=postgres, --dbname=postgres]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    labels:
      com.zigordev.backup: postgres
    networks: [notifications]

networks:
  zigordev:
    external: true
  notifications: {}

volumes:
  notifications-postgres-data: {}
