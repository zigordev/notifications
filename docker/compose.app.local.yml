name: notifications-app-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: notifications
    ports:
      - "5434:5432"
    volumes:
      - app-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: "json-file"
      options:
        labels: "com.docker.compose.project,com.docker.compose.service"
    networks:
      notifications_shared:
        aliases:
          - notifications-postgres

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.10
    restart: unless-stopped
    command:
      [
        "redpanda",
        "start",
        "--overprovisioned",
        "--smp",
        "1",
        "--memory",
        "1G",
        "--reserve-memory",
        "0M",
        "--check=false",
        "--node-id",
        "0",
        "--kafka-addr",
        "INTERNAL://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092",
        "--advertise-kafka-addr",
        "INTERNAL://notifications-redpanda:9092,OUTSIDE://localhost:19092",
        "--set",
        "redpanda.auto_create_topics_enabled=true"
      ]
    ports:
      - "19092:19092"
      - "19644:9644"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    logging:
      driver: "json-file"
      options:
        labels: "com.docker.compose.project,com.docker.compose.service"
    networks:
      notifications_shared:
        aliases:
          - notifications-redpanda

  console:
    image: docker.redpanda.com/redpandadata/console:v2.8.1
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: notifications-redpanda:9092
    ports:
      - "8081:8080"
    logging:
      driver: "json-file"
      options:
        labels: "com.docker.compose.project,com.docker.compose.service"
    networks: [notifications_shared]

  api:
    build:
      context: ..
      dockerfile: Dockerfile
      target: local
    restart: unless-stopped
    environment:
      PORT: 8080
      DB_HOST: notifications-postgres
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_NAME: notifications
      TRUST_PROXY: ${TRUST_PROXY:?TRUST_PROXY is required}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?OTEL_EXPORTER_OTLP_ENDPOINT is required}
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:?OPENBAO_TOKEN is required}
      OPENBAO_KV_MOUNT: kv
      OPENBAO_SECRET_PATH: notifications
      OPENBAO_REQUIRED_KEYS: SMTP_PASS
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS is required}
      NOTIFICATIONS_EMAIL_TOPIC: ${NOTIFICATIONS_EMAIL_TOPIC:?NOTIFICATIONS_EMAIL_TOPIC is required}
      NOTIFICATIONS_EMAIL_DLT_TOPIC: ${NOTIFICATIONS_EMAIL_DLT_TOPIC:?NOTIFICATIONS_EMAIL_DLT_TOPIC is required}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT is required}
      SMTP_USER: ${SMTP_USER:?SMTP_USER is required}
      SMTP_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SMTP_STARTTLS: ${SMTP_STARTTLS:?SMTP_STARTTLS is required}
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    command:
      [
        "sh",
        "-lc",
        "exec /app/scripts/openbao-run.sh java $JAVA_OPTS -jar /app/app.jar",
      ]
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        labels: "com.docker.compose.project,com.docker.compose.service"
    networks:
      notifications_shared:
        aliases:
          - notifications-api

  alloy:
    image: grafana/alloy:v1.12.0
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - app-local-alloy-data:/var/lib/alloy/data
    depends_on:
      - api
    networks: [notifications_shared]

networks:
  notifications_shared:
    name: platform_ops_shared
    external: true

volumes:
  app-local-pgdata:
  app-local-alloy-data:
